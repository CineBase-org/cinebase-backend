name: backend-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: cinebase

permissions:
  contents: read

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
    
      - name: Checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        env:
          SECRET_KEY: ci-only-test-secret-not-for-production
          DJANGO_SETTINGS_MODULE: cinema_base.settings.dev
        run: python manage.py test


  docker-ci:
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: python-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6
  
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: ${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}



