name: backend-deployment

run-name: ${{ github.actor }} - ${{ github.ref_name}} -${{ github.sha }}

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-deployment-${{ github.ref }}
  cancel-in-progress: false
  queue: max

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout
        uses: actions/checkout@v6

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django tests
        env:
          SECRET_KEY: ci-only-test-secret-not-for-production
          DJANGO_SETTINGS_MODULE: cinema_base.settings.dev
        run: python manage.py test


  docker-ci:

    outputs:
      image_registry: ${{ steps.login-ecr.outputs.registry }}
    permissions:
      contents: read
      id-token: write

    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: python-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
  deploy-to-ecs:
    permissions:
      contents: read
      id-token: write

    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    needs: docker-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get current task definition
        id: task-def
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ vars.ECS_TASK_DEFINITION }} \
            --query 'taskDefinition' \
            --output json > task-def.json

      - name: Prepare task definition
        id: update-task-def
        run: |
          jq 'del(.revision, .taskDefinitionArn, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)' task-def.json > task-def-clean.json

      - name: Update task definition with new image
        id: new-task-def
        run: |
          IMAGE_URI="${{ needs.docker-ci.outputs.image_registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          jq --arg IMAGE_URI "$IMAGE_URI" \
            '.containerDefinitions[0].image = $IMAGE_URI' \
            task-def-clean.json > task-def-new.json

      - name: Register ECS task definition and run database migrations
        id: run-migrations
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          cluster: ${{ vars.ECS_CLUSTER_NAME }}
          run-task: true
          run-task-launch-type: EC2
          task-definition: task-def-new.json
          service: ${{ vars.ECS_SERVICE_NAME }}
          run-task-container-overrides: |
            [
              {
                "name": "cinebase-container",
                "command": ["python", "manage.py", "migrate", "--noinput"]
              }
            ]
          wait-for-task-stopped: true
          wait-max-delay-seconds: 15
          wait-for-service-stability: true
